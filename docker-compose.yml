services:
  postgres:
    image: postgres:16-alpine
    container_name: seeit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seeit
      POSTGRES_PASSWORD: seeit
      POSTGRES_DB: seeit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeit -d seeit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
