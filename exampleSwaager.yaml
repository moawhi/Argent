                remnantTrafficThreshold:
                  type: number
                  format: float
                  description: The amount the second-highest bid must be lower than to qualify for adlogic.
                  minimum: 0.0
                filteringCountry:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: Country filtering mode
                filteringCity:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: City filtering mode
                filteringOs:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: OS filtering mode
                filteringBrowserType:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: Browser type filtering mode
                filteringDeviceType:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: Device type filtering mode
                filteringCategory:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: Category filtering mode
                filteringKeyword:
                  type: string
                  enum: [disabled, include, exclude]
                  default: disabled
                  description: Keyword filtering mode
                enabledByInterface:
                  type: boolean
                  default: true
                  description: Whether the campaign is enabled by the user interface
                enabledBySystem:
                  type: boolean
                  default: true
                  description: Whether the campaign is enabled by the system
                active:
                  type: boolean
                  default: true
                  description: Whether the campaign is active
                trackingEnabled:
                  type: boolean
                  default: true
                  description: Whether tracking is enabled for this campaign
                startDate:
                  type: string
                  format: date-time
                  nullable: true
                  description: Campaign start date/time. NULL means from the start of time. Send empty string to clear the date.
                stopDate:
                  type: string
                  format: date-time
                  nullable: true
                  description: Campaign stop date/time. NULL means no end date. Send empty string to clear the date.
                countries:
                  type: array
                  items:
                    type: string
                  description: List of countries to include/exclude
                cities:
                  type: array
                  items:
                    type: string
                  description: List of cities to include/exclude
                os:
                  type: array
                  items:
                    type: string
                  description: List of operating systems to include/exclude
                browserTypes:
                  type: array
                  items:
                    type: integer
                  description: List of browser types to include/exclude
                deviceTypes:
                  type: array
                  items:
                    type: integer
                  description: List of device types to include/exclude
                categories:
                  type: array
                  items:
                    type: string
                  description: List of categories to include/exclude
                keywords:
                  type: array
                  items:
                    type: string
                  description: List of keywords to include/exclude
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Campaign created successfully
                  campaign:
                    $ref: '#/components/schemas/Campaign'
            text/plain:
              schema:
                type: string
                description: CSV format of created campaign
                example: |
                  campaignId,accountId,name,timezone,dailyBudget,cpc,plAccountId,url,includeSubId,remnantTrafficOnly,remnantTrafficThreshold,filteringCountry,filteringCity,filteringOs,filteringBrowserType,filteringDeviceType,filteringCategory,filteringKeyword,enabledByInterface,enabledBySystem,active,trackingEnabled
                  1,1,"New Campaign","Australia/Melbourne",100.00,0.05,515,"http://example.com",true,true,0.01,"disabled","disabled","disabled","disabled","disabled","disabled","disabled",true,true,true,1
        '400':
