                          minimum: 0
                        commission_earned:
                          type: number
                          format: float
                          description: Commission earned for the period
                          minimum: 0
                        commission_rate:
                          type: number
                          format: float
                          description: Effective commission rate percentage
                          minimum: 0
                          maximum: 100
            text/plain:
              schema:
                type: string
                description: CSV format of top earning accounts
                example: |
                  accountId,redirects,total_cost,commission_earned,commission_rate
                  1,8000,400.00,80.00,20.00
                  2,4000,200.00,40.00,20.00
                  3,2000,100.00,20.00,20.00
        '400':
          description: Bad request - Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Campaign:
      type: object
      required:
        - campaignId
        - accountId
        - name
        - url
        - cpc
      properties:
        campaignId:
          type: integer
          description: Unique identifier for the campaign
        accountId:
          type: integer
          description: ID of the account this campaign belongs to
        name:
          type: string
          description: Name of the campaign
        timezone:
          type: string
          description: Timezone for the campaign
        dailyBudget:
          type: number
          format: float
          description: Daily budget for the campaign
          minimum: 0
        cpc:
          type: number
          format: float
          description: Cost per click for the campaign
          minimum: 0
          exclusiveMinimum: true
        plAccountId:
          type: integer
          description: The PL account ID this Adlogic campaign is mapped to.
          default: null
        url:
          type: string
          description: Target URL for the campaign
        commissionRate:
          type: number
          format: float
          description: Campaign-level commission rate (0-100). Null means inherit.
          nullable: true
          minimum: 0
          maximum: 100
        discount:
          type: number
          format: float
          description: Campaign-level discount percentage (0-100). Null means inherit.
          nullable: true
          minimum: 0
          maximum: 100
        includeSubId:
          type: boolean
          default: false
          description: Whether to include the SubID as part of the campaign's url
        remnantTrafficOnly:
          type: boolean
          default: false
          description: Whether this campaign is only eligible to be chosen if the other bids are lower than the given threshold.
        remnantTrafficThreshold:
          type: number
          format: float
          description: The amount the second-highest bid must be lower than to qualify for adlogic.
          minimum: 0.0
        filteringCountry:
          type: string
          enum: [disabled, include, exclude]
          description: Country filtering mode
        filteringCity:
          type: string
          enum: [disabled, include, exclude]
          description: City filtering mode
        filteringOs:
          type: string
          enum: [disabled, include, exclude]
          description: OS filtering mode
        filteringBrowserType:
          type: string
          enum: [disabled, include, exclude]
          description: Browser type filtering mode
        filteringDeviceType:
          type: string
          enum: [disabled, include, exclude]
          description: Device type filtering mode
        filteringCategory:
          type: string
          enum: [disabled, include, exclude]
          description: Category filtering mode
        filteringKeyword:
          type: string
          enum: [disabled, include, exclude]
          description: Keyword filtering mode
        enabledByInterface:
          type: boolean
          description: Whether the campaign is enabled by the user interface
        enabledBySystem:
          type: boolean
          description: Whether the campaign is enabled by the system
        status:
          type: string
          enum: [active, paused]
          description: Overall campaign status (active when both enabledByInterface and enabledBySystem are true, paused otherwise)
        active:
          type: boolean
          description: Whether the campaign is active
        trackingEnabled:
            type: boolean
            default: true
            description: Whether tracking is enabled for this campaign
        archived:
          type: boolean
          default: false
          description: Whether the campaign has been soft-archived. Archived campaigns are hidden from active listings but data and balance are preserved.
        startDate:
          type: string
          format: date-time
          nullable: true
          description: Campaign start date/time. NULL means from the start of time
        stopDate:
          type: string
          format: date-time
          nullable: true
          description: Campaign stop date/time. NULL means no end date
        balance:
          type: number
          format: float
          description: The current balance of the campaign
          nullable: true
        allTimeRedirects:
          type: integer
          description: All-time number of redirects for this campaign
          minimum: 0
        allTimeBids:
          type: integer
          description: All-time number of bids for this campaign
          minimum: 0
        allTimeSpend:
          type: number
          format: float
          description: All-time spend for this campaign (sum of parklogic_adlogic_bid_cost from tracking logs)
          minimum: 0
        averageCPM:
          type: number
          format: float
          description: All-time average CPM computed as (allTimeSpend / allTimeRedirects) * 1000. Returns 0 when there are no redirects.
          minimum: 0
        countries:
          type: array
          items:
            type: string
          description: List of countries to include/exclude
        cities:
          type: array
          items:
            type: string
          description: List of cities to include/exclude
        os:
          type: array
          items:
            type: string
          description: List of operating systems to include/exclude
        browserTypes:
          type: array
          items:
            type: integer
          description: List of browser types to include/exclude
        deviceTypes:
          type: array
          items:
            type: integer
          description: List of device types to include/exclude
        categories:
          type: array
          items:
            type: string
          description: List of categories to include/exclude
        keywords:
          type: array
          items:
            type: string
          description: List of keywords to include/exclude
    AccountGroup:
      type: object
      required:
        - accountGroupId
        - name
        - type
        - active
        - balance
      properties:
        accountGroupId:
          type: integer
          description: Unique identifier for the account group
        name:
          type: string
          description: Name of the account group
        type:
          type: string
          description: Group type (managed groups hold a shared balance; aggregate groups sum member account balances)
          enum: [ managed, aggregate ]
        terms:
          type: number
          format: float
          description: Low-balance threshold for managed groups
          nullable: true
        commissionRate:
          type: number
          format: float
          description: Group-level commission rate (0-100)
          nullable: true
          minimum: 0
          maximum: 100
        discount:
          type: number
          format: float
          description: Group-level discount percentage (0-100)
          nullable: true
          minimum: 0
          maximum: 100
        notificationEmail:
          type: string
          description: Email address for low-balance alerts
          nullable: true
        active:
          type: boolean
          description: Whether the account group is active
        balance:
          type: number
          format: float
          description: Current group balance (sum of group transactions for managed groups, sum of member account balances for aggregate groups)
        modifiedByUserId:
          type: integer
          description: ID of the user who last modified this account group
          nullable: true
    AccountGroupTransaction:
      type: object
      required:
        - accountGroupTransactionId
        - accountGroupId
        - amount
        - type
      properties:
        accountGroupTransactionId:
          type: integer
          description: Unique identifier for the account group transaction
        accountGroupId:
          type: integer
          description: ID of the account group this transaction belongs to
        accountTransactionId:
          type: integer
          description: Linked account transaction ID (for debit transactions)
          nullable: true
        amount:
          type: number
          format: float
          description: Transaction amount (positive for invoices/commissions, negative for debits)
        type:
          type: string
          description: Transaction type
          enum: [ invoice, debit, commission ]
        description:
          type: string
          description: Optional description of the transaction
          nullable: true
        datetimeCreated:
          type: string
          format: date-time
          description: When this transaction was created
          nullable: true
        modifiedByUserId:
          type: integer
          description: ID of the user who created or modified this transaction
          nullable: true
    Account:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: integer
          description: Unique identifier for the account
        name:
          type: string
          description: Name of the account
        balance:
          type: number
          format: float
          description: The amount of money available in this account
        commissionRate:
          type: number
          format: float
          description: Account-level commission rate (0-100). Null means no override.
          nullable: true
          minimum: 0
          maximum: 100
        discount:
          type: number
          format: float
          description: Account-level discount percentage (0-100). Null means no override.
          nullable: true
          minimum: 0
          maximum: 100
    AccountTransactions:
      type: object
      required:
        - accountTransactionId
        - productId
        - accountId
        - typeId
        - amount
      properties:
        accountTransactionId:
          type: integer
          description: Unique identifier for the account transaction
        productId:
          type: integer
          description: Product ID from transactionProduct table (2 for AdLogic)
          example: 2
        accountId:
          type: integer
          description: ID of the account this transaction belongs to
        typeId:
          type: integer
          description: Transaction type ID from transactionType table
        amount:
          type: number
          format: float
          description: The amount of money in this transaction (positive for deposits, negative for withdrawals)
        description:
          type: string
          description: Any special notes about this transaction
          nullable: true
        externalTransactionId:
          type: string
          description: Optional external transaction identifier
          nullable: true
        externalTransactionData:
          type: string
          description: Optional external transaction data
          nullable: true
        datetimeTransaction:
          type: string
          format: date-time
          description: Transaction datetime (defaults to datetimeCreated if not supplied)
          nullable: true
        modifiedByUserId:
          type: integer
          description: ID of the user who modified this transaction
          nullable: true
    CampaignTransaction:
      type: object
      required:
        - campaignTransactionId
        - accountId
        - campaignId
        - amount
      properties:
        campaignTransactionId:
          type: integer
          description: Unique identifier for the campaign transaction
        accountTransactionId:
          type: integer
          description: ID of the linked account transaction (from transactionAccount table)
          nullable: true
        accountId:
          type: integer
          description: ID of the account this transaction belongs to
        campaignSpendId:
          type: integer
          description: ID of the campaign spend that caused this transaction (null for transfers)
          nullable: true
        campaignId:
          type: integer
          description: ID of the campaign this transaction belongs to
          nullable: true
        amount:
          type: number
          format: float
          description: The amount of money in this transaction (positive for deposits, negative for withdrawals)
        description:
          type: string
          description: Any special notes about this transaction
          nullable: true
        date:
          type: string
          format: date
          description: Date of the transaction
          nullable: true
        datetimeCreated:
          type: string
          format: date-time
          description: When this transaction was created
        datetimeModified:
          type: string
          format: date-time
          description: When this transaction was last modified
        modifiedByUserId:
          type: integer
          description: ID of the user who modified this transaction
          nullable: true
    blockedSubIdsAccount:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: integer
          description: Account that has the blocked subId
        subId:
          type: string
          description: The blocked subId or domain
        encrypted:
          type: boolean
          description: Whether to encrypt the given subIds
        modifiedByUserId:
          type: integer
          description: ID of the last person to modify this item
    blockedSubIdsCampaign:
      type: object
      required:
        - campaignId
      properties:
        campaignId:
          type: integer
          description: Campaign that has the blocked subId
        subId:
          type: string
          description: The blocked subId or domain
        encrypted:
          type: boolean
          description: Whether to encrypt the given subIds
        modifiedByUserId:
          type: integer
          description: ID of the last person to modify this item