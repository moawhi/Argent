openapi: 3.0.0
info:
  title: AdLogic API
  description: API for AdLogic tracking and reporting system
  version: 1.0.0
  contact:
    name: AdLogic Support

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://adlogic-dev.parklogic.net
    description: Development server
  - url: https://adlogic.parklogic.net
    description: Production server

paths:
  /api/accounts:
    get:
      summary: Get all Accounts
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: List of Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
            text/plain:
              schema:
                type: string
                description: CSV format of account list
                example: |
                  accountId,name,balance
                  1,"test account 1",10.0
                  2,"test account 2",-5.4
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}:
    get:
      summary: Get Account by Account ID
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
            text/plain:
              schema:
                type: string
                description: CSV format of account list
                example: |
                  accountId,name,balance
                  1,"test account 1",10.0
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/transactions:
    get:
      summary: Get Account transactions by Account ID
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: Account transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountTransactions'
            text/plain:
              schema:
                type: string
                description: CSV format of account list
                example: |
                  accountTransactionId,productId,accountId,typeId,amount,description,externalTransactionId,externalTransactionData,datetimeTransaction
                  1,2,1,1,5.99,"testing",,,"2025-01-15 10:30:00"
                  2,2,1,2,-3.00,,,,"2025-01-15 11:00:00"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new account transaction (deposit/withdrawal)
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - typeId
                - amount
              properties:
                productId:
                  type: integer
                  description: Product ID from transactionProduct table (defaults to 2 for AdLogic)
                  default: 2
                  example: 2
                typeId:
                  type: integer
                  description: Transaction type ID from transactionType table
                  example: 1
                amount:
                  type: number
                  format: float
                  description: Transaction amount (positive number, sign determined by typeId)
                  minimum: 0
                  exclusiveMinimum: true
                description:
                  type: string
                  description: Optional description of the transaction
                externalTransactionId:
                  type: string
                  description: Optional external transaction identifier
                  nullable: true
                externalTransactionData:
                  type: string
                  description: Optional external transaction data (JSON or text)
                  nullable: true
                datetimeTransaction:
                  type: string
                  format: date-time
                  description: Transaction datetime (defaults to datetimeCreated if not supplied)
                  nullable: true
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transaction created successfully
                  transaction:
                    $ref: '#/components/schemas/AccountTransactions'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/transaction-history/pdf:
    get:
      summary: Get transaction history PDF invoice for account
      tags:
        - Accounts
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
        - name: startDate
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: PDF invoice document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: PDF document containing transaction history statement
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{id}/credit-advice/pdf:
    get:
      summary: Get monthly transaction Credit Advice PDF for account
      tags:
        - Accounts
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          description: Start date (YYYY-MM-DD). Required if endDate is provided. If not provided, use date parameter instead.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: End date (YYYY-MM-DD). Required if startDate is provided. If not provided, use date parameter instead.
          schema:
            type: string
            format: date
        - name: date
          in: query
          required: false
          description: Single date (YYYY-MM-DD). If provided, startDate will be set to the first day of that month and endDate will be set to this date. Alternative to using startDate and endDate.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Credit Advice PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: PDF document containing Credit Advice statement
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/accounts/{accountId}/transfer/{campaignId}:
    post:
      summary: Transfer funds between an account and a campaign
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountId
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
        - name: campaignId
          in: path
          required: true
          description: Campaign ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - typeId
              properties:
                amount:
                  type: number
                  format: float
                  description: Amount to transfer (positive number)
                  minimum: 0
                  exclusiveMinimum: true
                typeId:
                  type: integer
                  description: Transfer direction type (2 = Deposit to Campaign, 4 = Withdrawal from Campaign)
                  enum: [2, 4]
                description:
                  type: string
                  description: Optional custom description. If omitted, API auto-generates a descriptive message with campaign name and ID.
                  example: "Deposit fund into campaign Summer Push (ID: 123)"
      responses:
        '200':
          description: Transfer completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transfer completed successfully
                  typeId:
                    type: integer
                    description: Applied transfer direction type ID
                    enum: [2, 4]
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Campaign does not belong to this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/{accountId}/blockedSubIds:
    get:
      summary: Get a list of hashed blocked subIds for a given account
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      responses:
        '200':
          description: Account blocked SubIds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/blockedSubIdsAccount'
            text/plain:
              schema:
                type: string
                description: CSV format of blocked subIds
                example: |
                  subId
                  4cha.org,
                  0ebb.at
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add new blocked subIds to an account
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subIds
              properties:
                subIds:
                  type: string
                  description: List of subIds to block for this account
      responses:
        '201':
          description: SubIds blocked successfully for this account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: SubIds blocked successfully for this account
                  transaction:
                    $ref: '#/components/schemas/blockedSubIdsAccount'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove existing blocked subIds from an account
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subIds
              properties:
                subIds:
                  type: string
                  description: List of subIds to unblock for this account
      responses:
        '201':
          description: SubIds unblocked successfully for this account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: SubIds unblocked successfully for this account
                  transaction:
                    $ref: '#/components/schemas/blockedSubIdsAccount'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account-groups:
    get:
      summary: Get all account groups
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: List of account groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountGroup'
            text/plain:
              schema:
                type: string
                description: CSV format of account group list
                example: |
                  accountGroupId,name,type,terms,commissionRate,discount,notificationEmail,active,balance,modifiedByUserId
                  1,"Managed Group",managed,1000.0,10.0,5.0,"alerts@example.com",true,500.0,
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new account group
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the account group
                type:
                  type: string
                  description: Group type
                  enum: [ managed, aggregate ]
                  default: managed
                terms:
                  type: number
                  format: float
                  description: Low-balance threshold for managed groups (required when type is managed)
                  nullable: true
                commissionRate:
                  type: number
                  format: float
                  description: Group-level commission rate (0-100)
                  nullable: true
                  minimum: 0
                  maximum: 100
                discount:
                  type: number
                  format: float
                  description: Group-level discount percentage (0-100)
                  nullable: true
                  minimum: 0
                  maximum: 100
                notificationEmail:
                  type: string
                  description: Email address for low-balance alerts
                  nullable: true
      responses:
        '201':
          description: Account group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account-groups/{accountGroupId}:
    get:
      summary: Get account group by ID
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: Account group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
            text/plain:
              schema:
                type: string
                description: CSV format of account group
                example: |
                  accountGroupId,name,type,terms,commissionRate,discount,notificationEmail,active,balance,modifiedByUserId
                  1,"Managed Group",managed,1000.0,10.0,5.0,"alerts@example.com",true,500.0,
        '404':
          description: Account group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an account group
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the account group
                type:
                  type: string
                  description: Group type
                  enum: [ managed, aggregate ]
                terms:
                  type: number
                  format: float
                  description: Low-balance threshold for managed groups
                  nullable: true
                commissionRate:
                  type: number
                  format: float
                  description: Group-level commission rate (0-100)
                  nullable: true
                  minimum: 0
                  maximum: 100
                discount:
                  type: number
                  format: float
                  description: Group-level discount percentage (0-100)
                  nullable: true
                  minimum: 0
                  maximum: 100
                notificationEmail:
                  type: string
                  description: Email address for low-balance alerts
                  nullable: true
                active:
                  type: boolean
                  description: Whether the account group is active
      responses:
        '200':
          description: Account group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroup'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account-groups/{accountGroupId}/accounts:
    get:
      summary: Get all accounts in an account group
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: List of accounts in the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
            text/plain:
              schema:
                type: string
                description: CSV format of account list
                example: |
                  accountId,name,balance,commissionRate,discount
                  1,"test account 1",10.0,,
                  2,"test account 2",-5.4,,
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new account in an account group
      tags:
        - Accounts
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the account
                commissionRate:
                  type: number
                  format: float
                  description: Account-level commission rate (0-100). Null means no override.
                  nullable: true
                  minimum: 0
                  maximum: 100
                discount:
                  type: number
                  format: float
                  description: Account-level discount percentage (0-100). Null means no override.
                  nullable: true
                  minimum: 0
                  maximum: 100
                plAccountId:
                  type: integer
                  description: Optional PL account ID mapping
                  nullable: true
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
            text/plain:
              schema:
                type: string
                description: CSV format of created account
                example: |
                  accountId,name,balance,commissionRate,discount
                  3,"new account",0.0,,
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/account-groups/{accountGroupId}/transactions:
    get:
      summary: Get account group transactions
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [ json, csv ]
            default: json
      responses:
        '200':
          description: List of account group transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountGroupTransaction'
            text/plain:
              schema:
                type: string
                description: CSV format of account group transactions
                example: |
                  accountGroupTransactionId,accountGroupId,accountTransactionId,amount,type,description,datetimeCreated,modifiedByUserId
                  1,1,,500.0,invoice,"Initial deposit","2025-01-15 10:30:00",
                  2,1,42,-50.0,debit,"User account deposit","2025-01-16 11:00:00",
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an invoice transaction for a managed account group
      description: Adds a positive deposit to a managed account group. Not supported for aggregate groups.
      tags:
        - Account Groups
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountGroupId
          in: path
          required: true
          description: Account Group ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
