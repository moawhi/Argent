                  default: Australia/Melbourne
                dailyBudget:
                  type: number
                  format: float
                  description: Daily budget for the campaign
                  minimum: 0
                cpc:
                  type: number
                  format: float
                  description: Cost per click for the campaign
                  minimum: 0
                  exclusiveMinimum: true
                plAccountId:
                  type: integer
