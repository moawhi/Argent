          schema:
            type: integer
        - name: fromDate
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: timezone
          in: query
          required: false
          description: Timezone (default Australia/Melbourne)
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Traffic provider report
          content:
            application/json:
              schema:
                type: object
                required:
                  - fromDate
                  - toDate
                  - timezone
                  - stats
                properties:
                  fromDate:
                    type: string
                    format: date
                    description: Start date of the report period
                  toDate:
                    type: string
                    format: date
                    description: End date of the report period
                  timezone:
                    type: string
                    description: Timezone used for the report
                  stats:
                    type: object
                    description: Statistics grouped by date, where each key is a date in YYYY-MM-DD format
                    example:
                      "2025-01-01":
                        - subId: "sub1"
                          views: 1000
                          revenue: 25.50
                        - subId: "sub2"
                          views: 2000
                          revenue: 50.75
                      "2025-01-02":
                        - subId: "sub1"
                          views: 1500
                          revenue: 37.25
                    additionalProperties:
                      type: array
                      description: Array of statistics for each subId on the given date (YYYY-MM-DD)
                      items:
                        type: object
                        required:
                          - subId
                          - views
                          - revenue
                        properties:
                          subId:
                            type: string
                            description: Sub-identifier for the traffic source
                          views:
                            type: integer
                            description: Number of views/impressions
                            minimum: 0
                          revenue:
                            type: number
                            format: float
                            description: Revenue generated in the specified currency
                            minimum: 0
            text/plain:
              schema:
                type: string
                description: CSV format of traffic provider report
                example: |
                  date,subId,views,clicks,numberOfBids,revenue
                  2025-01-01,sub1,1000,800,1200,25.50
                  2025-01-01,sub2,2000,1500,2200,50.75
                  2025-01-02,sub1,1500,1200,1600,37.25
        '400':
          description: Bad request - Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

