  /api/campaigns:
    get:
      summary: Get all campaigns
      description: Authenticated endpoint; admin rights are not required.
      tags:
        - Campaigns
      parameters:
        - name: filterBy
          in: query
          required: false
          description: "JSON object or comma-separated key:value pairs to filter results by multiple fields (e.g., '{\"status\":\"active\",\"balance\":0,\"balanceCmp\":\"lte\"}' or 'status:active,balance:0,balanceCmp:lte'). Allowed keys: status,outOfBudget,balance,balanceCmp,trafficRate,name,timezone,dailyBudget,dailyBudgetCmp"
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: "Comma-separated fields with optional :asc|:desc (or JSON array). Example: 'name:asc,balance:desc,allTimeRedirects:desc,allTimeBids:desc,allTimeSpend:desc,averageCPM:desc'"
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountId
          in: query
          required: false
          description: Account ID to filter campaigns
          schema:
            type: integer
        - name: format
          in: query
          required: false
          description: Response format (json or csv)
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: status
          in: query
          required: false
          description: Filter by campaign status derived from enabled flags (active|paused)
          schema:
            type: string
            enum: [active, paused]
        - name: balance
          in: query
          required: false
          description: Balance amount to compare against when used with balanceCmp
          schema:
            type: number
        - name: balanceCmp
          in: query
          required: false
          description: Comparison operator for balance (one of lt,lte,gt,gte,eq)
          schema:
            type: string
            enum: [lt, lte, gt, gte, eq]
        - name: outOfBudget
          in: query
          required: false
          description: When true, only campaigns with balance < 0 are returned
          schema:
            type: boolean
        - name: trafficRate
          in: query
          required: false
          description: Filter by traffic rate (e.g., accelerated)
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Case-insensitive substring match on campaign name
          schema:
            type: string
        - name: timezone
          in: query
          required: false
          description: Exact match on timezone
          schema:
            type: string
        - name: dailyBudget
          in: query
          required: false
          description: Daily budget amount to compare against when used with dailyBudgetCmp
          schema:
            type: number
        - name: dailyBudgetCmp
          in: query
          required: false
          description: Comparison operator for dailyBudget (one of lt,lte,gt,gte,eq)
          schema:
            type: string
            enum: [lt, lte, gt, gte, eq]

      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
            text/plain:
              schema:
                type: string
                description: CSV format of campaigns list
                example: |
                  campaignId,accountId,name,timezone,dailyBudget,cpc,plAccountId,url,includeSubId,remnantTrafficOnly,remnantTrafficThreshold,filteringCountry,filteringCity,filteringOs,filteringBrowserType,filteringDeviceType,filteringCategory,filteringKeyword,enabledByInterface,enabledBySystem,active,trackingEnabled
                  1,1,"Campaign 1","Australia/Melbourne",100.00,0.05,515,"http://example.com",true,true,0.01,"disabled","disabled","disabled","disabled","disabled","disabled","disabled",true,true,true,1
                  2,1,"Campaign 2","Australia/Melbourne",200.00,0.10,null,"http://example2.com",true,false,0.01,"disabled","disabled","disabled","disabled","disabled","disabled","disabled",true,true,true,0
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new campaign
      description: Requires admin rights from authenticated user group
      tags:
        - Campaigns
      parameters:
        - name: apiu
          in: query
          required: true
          description: API username
          schema:
            type: string
        - name: apik
          in: query
          required: true
          description: API key
          schema:
            type: string
        - name: accountId
          in: query
          required: false
