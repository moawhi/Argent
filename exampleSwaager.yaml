          schema:
            type: string
            enum: [json, csv]
            default: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - url
                - cpc
              properties:
                accountId:
                  type: integer
                  description: ID of the account this campaign belongs to
                name:
                  type: string
                  description: Name of the campaign
                timezone:
                  type: string
